name: SHOWSET quality gate

on:
  pull_request:
    branches: [main, "integration/studio2-*"]
  push:
    branches: [main, "fix/studio2-*"]

permissions:
  contents: read

concurrency:
  group: showset-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, content checks, static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Content and asset validation
        run: npm run lint:source
      - name: Page SEO content validation
        run: npm run check:seo
      - name: Scalable case-study portfolio regression
        run: node qa/portfolio-growth.cjs
      - name: Static Next.js build
        run: npm run build
      - name: Browser acceptance checks (homepage, cases, services and Studio)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 3001 --directory out >/tmp/showset-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 1
          done
          # Run all browser suites, then fail if any failed. Do not mask failures.
          qa_status=0
          SHOWSET_PRODUCTION_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/studio2-production.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/mobile-tablet-audit.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/event-format-row.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/studio-scroll-hero.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/studio-heading-alignment.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/closing-cta-parity.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/editorial-pages.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/heading-accent-lines.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/homepage-motion-parity.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/story-copy-balance.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/home-work-carousel.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/carousel-playback.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/header-navigation-alignment.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/instant-route-top.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/site-typography.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/footer-capability-hover.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/editorial-columns.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/case-related-descriptions.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-experience.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-studio.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-lifecycle.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-motion-design.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/photo-headline-swipe.cjs || qa_status=1
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/non-photo-headlines.cjs || qa_status=1
          exit "$qa_status"
      - name: Archive browser QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showset-home-work-browser-qa
          path: |
            qa-results/mobile-tablet-audit.json
            qa-results/mobile-tablet/
            qa-results/event-format-row.json
            qa-results/event-formats/
            qa-results/service-motion/
            qa-results/photo-headline-swipe.json
            qa-results/homepage-motion-parity.json
            qa-results/story-copy-balance.json
            qa-results/story-copy/
            qa-results/homepage-parity/
            qa-results/non-photo-headlines.json
            qa-results/heading-accent-lines.json
            qa-results/studio-scroll-hero.json
            qa-results/studio-heading-alignment.json
            qa-results/closing-cta-parity.json
            qa-results/closing-cta/
            qa-results/editorial-pages.json
            qa-results/editorial/
            qa-results/services/
            qa-results/service-studio.json
            qa-results/service-lifecycle.json
            qa-results/home-work-carousel.json
            qa-results/carousel-playback.json
            qa-results/header-navigation-alignment.json
            qa-results/instant-route-top.json
            qa-results/site-typography.json
            qa-results/footer-capability-hover.json
            qa-results/editorial-columns.json
            qa-results/case-related-descriptions.json
            qa-results/case-related-1796.png
            qa-results/case-related-390.png
            qa-results/header-desktop.png
            qa-results/header-mobile.png
          if-no-files-found: ignore

  studio2:
    name: Studio 2.0 local editor and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Component model and cloud security contract
        run: |
          node qa/studio2-model.cjs
          node qa/studio2-cloud-contract.cjs
          node qa/studio2-save-coordinator.cjs
          node qa/studio2-cloud-originals.cjs
          node qa/studio2-public-template-parity.cjs
          node qa/studio2-cloud-schema.cjs
          node qa/studio2-release.cjs
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Actual Next.js editing, media, conflicts and reversible motion
        env:
          SHOWSET_BASE_URL: http://127.0.0.1:3002
          SHOWSET_PLAYWRIGHT_CHANNEL: chromium
          SHOWSET_QA_OUTPUT: qa-results/studio2
        run: |
          npm run dev -- --hostname 127.0.0.1 -p 3002 >/tmp/showset-studio2.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3002/studio/next/ >/dev/null; then break; fi
            sleep 1
          done
          node qa/studio2-builder.cjs
          node qa/studio2-selection.cjs
          node qa/studio2-existing-media.cjs
          node qa/studio2-existing-text.cjs
          node qa/studio2-template-sections.cjs
          node qa/studio2-native-rebuild.cjs
          node qa/studio2-recovery.cjs
          node qa/studio2-motion.cjs
          node qa/studio2-touch.cjs
      - name: Archive Studio screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showset-studio2-browser-evidence
          path: |
            qa-results/studio2/*.png
            qa-results/studio2/video/*.webm
            qa-results/studio2/motion-video/*.webm
          if-no-files-found: ignore
