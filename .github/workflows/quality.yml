name: SHOWSET quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: showset-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, content checks, static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Content and asset validation
        run: npm run lint:source
      - name: Page SEO content validation
        run: npm run check:seo
      - name: Static Next.js build
        run: npm run build
      - name: Browser acceptance checks (homepage, cases, services and Studio)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 3001 --directory out >/tmp/showset-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 1
          done
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/home-work-carousel.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/carousel-playback.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/header-navigation-alignment.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/instant-route-top.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/site-typography.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/editorial-columns.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/case-related-descriptions.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-experience.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-studio.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-lifecycle.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/service-motion-design.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/photo-headline-swipe.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/non-photo-headlines.cjs
          SHOWSET_BASE_URL=http://127.0.0.1:3001 SHOWSET_PLAYWRIGHT_CHANNEL=chromium node qa/heading-accent-lines.cjs
      - name: Archive browser QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showset-home-work-browser-qa
          path: |
            qa-results/service-motion/
            qa-results/photo-headline-swipe.json
            qa-results/non-photo-headlines.json
            qa-results/heading-accent-lines.json
            qa-results/services/
            qa-results/service-studio.json
            qa-results/service-lifecycle.json
            qa-results/home-work-carousel.json
            qa-results/carousel-playback.json
            qa-results/header-navigation-alignment.json
            qa-results/instant-route-top.json
            qa-results/site-typography.json
            qa-results/editorial-columns.json
            qa-results/case-related-descriptions.json
            qa-results/case-related-1796.png
            qa-results/case-related-390.png
            qa-results/header-desktop.png
            qa-results/header-mobile.png
          if-no-files-found: ignore
