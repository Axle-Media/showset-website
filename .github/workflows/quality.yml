name: SHOWSET quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: showset-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, content checks, static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Content and asset validation
        run: npm run lint:source
      - name: Page SEO content validation
        run: npm run check:seo
      - name: Static Next.js build
        run: npm run build
